version: 2
updates:
  - package-ecosystem: github-actions
    # "/" only covers .github/workflows. Composite actions under
    # .github/actions are silently skipped, so their pinned dependencies
    # (actions/cache in setup-scoop) never get update PRs. The "**/*" glob
    # recurses; a bare "*" would only reach one level down.
    directories:
      - /
      - /.github/actions/**/*
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Hong_Kong"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    ignore:
      - dependency-name: "ScoopInstaller/GithubActions"
