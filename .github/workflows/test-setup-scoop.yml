name: Test Setup Scoop

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Scoop (cached)
        uses: ./.github/actions/setup-scoop
      - name: Verify
        shell: pwsh
        run: |
          Write-Host "SCOOP_HOME=$env:SCOOP_HOME"
          scoop --version
