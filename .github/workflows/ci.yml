name: CI

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'bucket/**'
      - 'bin/**'
      - 'scripts/**'
      - 'Scoop-Bucket.Tests.ps1'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'bucket/**'
      - 'bin/**'
      - 'scripts/**'
      - 'Scoop-Bucket.Tests.ps1'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run manifest linter
        shell: pwsh
        run: .\bin\lint.ps1
      - name: Install and cache PSScriptAnalyzer
        uses: potatoqualitee/psmodulecache@ee5e9494714abf56f6efbfa51527b2aec5c761b8 # v6.2.1
        with:
          modules-to-cache: PSScriptAnalyzer
          shell: pwsh
      - name: Run PowerShell analyzer
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path .\bin -Settings .\PSScriptAnalyzerSettings.psd1 -Recurse)
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: no errors.'

  test:
    name: Test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
      - name: Checkout Scoop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ScoopInstaller/Scoop
          path: 'scoop_core'
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@ee5e9494714abf56f6efbfa51527b2aec5c761b8 # v6.2.1
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\bin\test.ps1
