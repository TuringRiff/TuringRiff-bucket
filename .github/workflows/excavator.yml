name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run every 8 hours
    - cron: '20 */8 * * *'

concurrency:
  group: excavator
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@a709983c0692a8a853c288cf5e9bf14658107936 # main as of 2026-08-06
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
          # Do NOT set THROW_ERROR=1: one bad app would block updates for the whole bucket.
      - name: Close Resolved Failure Issues
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'excavator-failure'
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed resolved issue #${issue.number}`);
            }
      - name: Report Failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'excavator-failure'
            });
            if (issues.length > 0) {
              console.log('An open excavator failure issue already exists, skipping...');
              return;
            }
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Excavator Auto-Update Workflow Failed',
              labels: ['excavator-failure'],
              body: `The Excavator workflow encountered an error while scanning or updating manifests.\n\nPlease check the [Actions Log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            })

  # Scoop treats per-app autoupdate failures as soft errors (Excavate can stay green).
  # Re-run checkver without -Update; residual "upstream newer" becomes a visible Issue.
  detect-outdated:
    name: Detect outdated manifests
    needs: excavate
    if: always() && needs.excavate.result != 'cancelled'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name || 'master' }}
          fetch-depth: 0

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          Invoke-RestMethod get.scoop.sh -OutFile install.ps1
          # Non-interactive CI install; -RunAsAdmin is required by the installer on GHA runners
          .\install.ps1 -RunAsAdmin

          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          if (-not (Test-Path $scoopRoot)) {
            $scoopRoot = Join-Path $env:USERPROFILE 'SCOOP'
          }
          $scoopHome = Join-Path $scoopRoot 'apps\scoop\current'
          $shims = Join-Path $scoopRoot 'shims'

          if (-not (Test-Path (Join-Path $scoopHome 'bin\checkver.ps1'))) {
            throw "Scoop install failed: checkver not found under $scoopHome"
          }

          # Persist for subsequent steps (new shells do not inherit installer PATH tweaks)
          "SCOOP=$scoopRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SCOOP_HOME=$scoopHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $shims | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $env:SCOOP = $scoopRoot
          $env:SCOOP_HOME = $scoopHome
          $env:Path = "$shims;$env:Path"

          scoop config aria2-enabled false
          Write-Host "SCOOP=$env:SCOOP"
          Write-Host "SCOOP_HOME=$env:SCOOP_HOME"
          scoop --version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect residual outdated manifests
        id: detect
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "SCOOP=$env:SCOOP SCOOP_HOME=$env:SCOOP_HOME"
          if (-not $env:SCOOP_HOME) {
            $env:SCOOP = Join-Path $env:USERPROFILE 'scoop'
            $env:SCOOP_HOME = Join-Path $env:SCOOP 'apps\scoop\current'
          }
          .\bin\detect-outdated.ps1 -Dir .\bucket -SummaryPath .\outdated-summary.md

      - name: Upload drift summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outdated-summary
          path: outdated-summary.md
          if-no-files-found: ignore

      - name: Manage manifest-outdated issues
        if: always() && steps.detect.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_DRIFT: ${{ steps.detect.outputs.has_drift }}
        with:
          script: |
            const fs = require('fs');
            const label = 'manifest-outdated';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const hasDrift = (process.env.HAS_DRIFT || '').toLowerCase() === 'true';

            let summary = '';
            try {
              summary = fs.readFileSync('outdated-summary.md', 'utf8');
            } catch {
              summary = '_No summary file produced._\n';
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              });
            } catch {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'E4A73E',
                  description: 'Bucket manifest lags upstream or checkver is broken'
                });
              } catch (e) {
                console.log('createLabel skipped:', e.message);
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (!hasDrift) {
              for (const issue of issues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Resolved: no residual outdated manifests on re-check.\n\nRun: ${runUrl}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                console.log(`Closed resolved issue #${issue.number}`);
              }
              return;
            }

            const body = [
              'Excavator finished, but **one or more manifests still lag upstream** (or checkver errors remain).',
              '',
              'This usually means `checkver` found a new version, but `autoupdate` soft-failed (bad URL template, asset rename, hash failure, etc.) — the main Excavate step can still be green.',
              '',
              summary,
              '',
              `Actions run: ${runUrl}`,
              '',
              '### Fix locally',
              '```powershell',
              '.\\bin\\checkver.ps1 <app> -u',
              '```'
            ].join('\n');

            if (issues.length > 0) {
              const issue = issues[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Updated after run ${runUrl}`
              });
              console.log(`Updated issue #${issue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Manifests lagging upstream (autoupdate soft-fail)',
                labels: [label],
                body
              });
              console.log('Created manifest-outdated issue');
            }

      - name: Report detect step failure
        if: always() && steps.detect.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'excavator-failure'
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `detect-outdated job failed.\n\n${runUrl}`
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Excavator Auto-Update Workflow Failed',
              labels: ['excavator-failure'],
              body: `The **detect-outdated** job failed (could not verify residual manifest drift).\n\n${runUrl}`
            });
