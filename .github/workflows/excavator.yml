name: Excavator

on:
  workflow_dispatch:
  schedule:
    # run every 8 hours
    - cron: '20 */8 * * *'

concurrency:
  group: excavator
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Excavate
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
          # Do NOT set THROW_ERROR=1: one bad app would block updates for the whole bucket.
      # Safe to close every excavator-failure issue only because this job is the
      # sole creator of that label. Other jobs must use their own label.
      - name: Close Resolved Failure Issues
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'excavator-failure'
            });
            for (const issue of issues) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed resolved issue #${issue.number}`);
            }
      - name: Report Failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'excavator-failure'
            });
            if (issues.length > 0) {
              console.log('An open excavator failure issue already exists, skipping...');
              return;
            }
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Excavator Auto-Update Workflow Failed',
              labels: ['excavator-failure'],
              body: `The Excavator workflow encountered an error while scanning or updating manifests.\n\nPlease check the [Actions Log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            })

  # Scoop treats per-app autoupdate failures as soft errors (Excavate can stay green).
  # Re-run checkver without -Update; residual "upstream newer" becomes a visible Issue.
  detect-outdated:
    name: Detect outdated manifests
    needs: excavate
    if: always() && needs.excavate.result != 'cancelled'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name || 'master' }}
          fetch-depth: 0

      - name: Setup Scoop (cached)
        uses: ./.github/actions/setup-scoop

      - name: Detect residual outdated manifests
        id: detect
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "SCOOP=$env:SCOOP SCOOP_HOME=$env:SCOOP_HOME"
          if (-not $env:SCOOP_HOME) {
            $env:SCOOP = Join-Path $env:USERPROFILE 'scoop'
            $env:SCOOP_HOME = Join-Path $env:SCOOP 'apps\scoop\current'
          }
          .\bin\detect-outdated.ps1 -Dir .\bucket -SummaryPath .\outdated-summary.md

      - name: Upload drift summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outdated-summary
          path: outdated-summary.md
          if-no-files-found: ignore

      # One issue, but for two distinct faults: manifests that lag upstream and
      # manifests whose checkver could not produce a version at all. Reporting
      # both under a single "autoupdate soft-fail" title pointed maintainers at
      # autoupdate.url even when the real defect was in checkver, so the title,
      # the intro, and the fix hints are now derived from which kinds are present.
      - name: Manage manifest-outdated issues
        if: always() && steps.detect.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_OUTDATED: ${{ steps.detect.outputs.has_outdated }}
          HAS_ERRORS: ${{ steps.detect.outputs.has_errors }}
          OUTDATED_COUNT: ${{ steps.detect.outputs.outdated_count }}
          ERROR_COUNT: ${{ steps.detect.outputs.error_count }}
        with:
          script: |
            const fs = require('fs');
            const label = 'manifest-outdated';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const hasOutdated = (process.env.HAS_OUTDATED || '').toLowerCase() === 'true';
            const hasErrors = (process.env.HAS_ERRORS || '').toLowerCase() === 'true';
            const outdatedCount = process.env.OUTDATED_COUNT || '?';
            const errorCount = process.env.ERROR_COUNT || '?';

            let summary = '';
            try {
              summary = fs.readFileSync('outdated-summary.md', 'utf8');
            } catch {
              summary = '_No summary file produced._\n';
            }

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              });
            } catch {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'E4A73E',
                  description: 'Bucket manifest lags upstream or checkver is broken'
                });
              } catch (e) {
                console.log('createLabel skipped:', e.message);
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (!hasOutdated && !hasErrors) {
              for (const issue of issues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Resolved: no residual outdated manifests and no checkver errors on re-check.\n\nRun: ${runUrl}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                console.log(`Closed resolved issue #${issue.number}`);
              }
              return;
            }

            const intro = [];
            const fixes = [];

            if (hasOutdated) {
              intro.push(
                `- ${outdatedCount} manifest(s) **lag upstream**: \`checkver\` did find a newer version, but \`autoupdate\` did not land (bad URL template, asset rename, hash failure, etc.). The Excavate step can still be green.`
              );
              fixes.push(
                'For each lagging manifest (rewrite the URL and refresh hashes from upstream):',
                '',
                '```powershell',
                '.\\bin\\checkver.ps1 <app> -u',
                '```'
              );
            }

            if (hasErrors) {
              intro.push(
                `- ${errorCount} manifest(s) **cannot be checked at all**: \`checkver\` failed, so whether they are current is unknown. This is a \`checkver\` problem, not an \`autoupdate\` one.`
              );
              fixes.push(
                'For each uncheckable manifest (inspect the error first — do **not** use `-u`, it needs a working checkver):',
                '',
                '```powershell',
                '.\\bin\\checkver.ps1 <app> -ThrowError',
                '```'
              );
            }

            const kinds = [hasOutdated ? 'outdated' : null, hasErrors ? 'checkver broken' : null].filter(Boolean);
            const title = `⚠️ Unhealthy manifests (${kinds.join(' + ')})`;

            const body = [
              'Excavator finished, but the bucket is not fully healthy.',
              '',
              ...intro,
              '',
              summary,
              '',
              `Actions run: ${runUrl}`,
              '',
              '### Fix locally',
              ...fixes
            ].join('\n');

            if (issues.length > 0) {
              const issue = issues[0];
              // Rename an existing issue too: its title is derived from the current
              // state, so a leftover title from an earlier failure kind would keep
              // describing a fault that has since changed.
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Updated after run ${runUrl} (${kinds.join(', ')})`
              });
              console.log(`Updated issue #${issue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [label],
                body
              });
              console.log('Created manifest-outdated issue');
            }

      # Uses its own label, not excavator-failure: the excavate job unconditionally
      # closes every excavator-failure issue on success, so sharing the label made
      # a persistently broken detect step churn a brand-new issue every run.
      - name: Manage detect-failure issues
        if: always() && steps.detect.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
        with:
          script: |
            const label = 'detect-failure';
            const failed = process.env.DETECT_OUTCOME === 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label
              });
            } catch {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label,
                  color: 'B60205',
                  description: 'detect-outdated job could not verify manifest drift'
                });
              } catch (e) {
                console.log('createLabel skipped:', e.message);
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label
            });

            if (!failed) {
              for (const issue of issues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Resolved: detect-outdated completed successfully.\n\nRun: ${runUrl}`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed'
                });
                console.log(`Closed resolved issue #${issue.number}`);
              }
              return;
            }

            const body = [
              'The **detect-outdated** job failed, so residual manifest drift could not be verified.',
              '',
              'While this is failing, `manifest-outdated` issues are not being opened or closed — treat the bucket drift state as unknown.',
              '',
              `Actions run: ${runUrl}`,
              '',
              '### Reproduce locally',
              '```powershell',
              '.\\bin\\detect-outdated.ps1 -Dir .\\bucket',
              '```'
            ].join('\n');

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Still failing after run ${runUrl}`
              });
              console.log(`Updated issue #${issues[0].number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 detect-outdated job failed',
                labels: [label],
                body
              });
              console.log('Created detect-failure issue');
            }
